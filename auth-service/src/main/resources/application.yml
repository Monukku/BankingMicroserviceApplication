## ─────────────────────────────────────────────────────────────────────────────
## auth-ms — COMMON base config (profile-independent).
## Environment-specific endpoints/credentials live in application-{dev,prod}.yml.
## Active profile defaults to `prod`; override with SPRING_PROFILES_ACTIVE or
## -Dspring.profiles.active=dev for local development.
## ─────────────────────────────────────────────────────────────────────────────
server:
  port: 8073
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: auth-ms
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}

  datasource:
    hikari:
      # Pool raised from 2 → 10 (was starved under load — see load-test notes).
      maximum-pool-size: 10
      minimum-idle: 2
      # 3s (was 30s): a DB-connection wait must finish well inside the service's Istio
      # Backend VS (10s) so we fail internally before Istio cuts the request.
      connection-timeout: 3000
      idle-timeout: 600000

  jpa:
    hibernate:
      ddl-auto: validate         # Flyway manages schema — never let JPA alter it
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all                  # wait for all replicas — banking grade
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1

keycloak:
  realm:         ${KEYCLOAK_REALM:rewabank}
  client-id:     ${KEYCLOAK_CLIENT_ID:rewabank-ms}
  client-secret: ${KEYCLOAK_CLIENT_SECRET}   # from Secret

kafka:
  topics:
    user-registered: bank.user.registered
    user-locked:     bank.user.locked

otp:
  expiry-seconds: 300            # 5 minutes
  bcrypt-strength: 5             # 2^5=32 iterations — fast for short-lived OTPs
  max-attempts: 3                # OTPs per rate window before throttle
  rate-window-minutes: 10        # rate-limit window
  lock-minutes: 15               # account lock duration after max failed verifications

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{rewabank-correlation-id}] [%X{traceId}] %-5level %logger{36} - %msg%n"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html