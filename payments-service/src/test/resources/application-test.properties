spring.datasource.url=jdbc:h2:mem:pymttestdb;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
# Keep RedisAutoConfiguration enabled: RedisConfig.stringRedisTemplate needs a
# RedisConnectionFactory for the context to load. Lettuce is lazy (no startup
# connect), so no running Redis is required for @SpringBootTest context tests.
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration,\
  org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/auth/realms/test
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/auth/realms/test/protocol/openid-connect/certs
razorpay.key-id=test_key_id
razorpay.key-secret=test_key_secret
razorpay.webhook-secret=test_webhook_secret
logging.level.root=WARN
logging.level.com.rewabank=DEBUG
