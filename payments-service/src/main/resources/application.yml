## ─────────────────────────────────────────────────────────────────────────────
## payments-service — COMMON base config (profile-independent).
## Environment-specific endpoints/credentials live in application-{dev,prod}.yml.
## Active profile defaults to `prod`; override with SPRING_PROFILES_ACTIVE or
## -Dspring.profiles.active=dev for local development.
## ─────────────────────────────────────────────────────────────────────────────
server:
  port: 8083

spring:
  application:
    name: payments-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}

  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 5000
      # Neon's serverless pooler drops idle connections server-side (~5 min). Recycle
      # before that (idle-timeout < max-lifetime) + proactively ping idle ones so load
      # never hits a stale "connection has been closed" validation failure.
      max-lifetime: 240000
      keepalive-time: 120000
      idle-timeout: 180000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

razorpay:
  key-id:         ${RAZORPAY_KEY_ID}
  key-secret:     ${RAZORPAY_KEY_SECRET}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET}

management:
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

logging:
  pattern:
    level: "%5p[${spring.application.name},%X{traceId},%X{spanId}]"
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{traceId}] %-5level %logger{36} - %msg%n"