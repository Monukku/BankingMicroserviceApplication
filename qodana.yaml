version: "1.0"

linter: jetbrains/qodana-jvm-community:2026.1

projectJDK: "21"

profile:
  name: qodana.recommended

include:
  - name: BigDecimalMethodWithoutRoundingCalled
  - name: ConstantConditions
  - name: StringEquality
  - name: ThrowablePrintStackTrace
  - name: SystemOutErr
  - name: SqlNoDataSourceInspection
  - name: OptionalUsedAsFieldOrParameterType

exclude:
  - name: UnusedDeclaration
    paths:
      - "*/entity/*.java"
      - "*/dto/*.java"
  - name: JUnitTestMethodWithoutAssertion
    paths:
      - "*/test/**"
  - name: SqlResolve
    paths:
      - "*/db/migration/**"
  - name: ALL
    paths:
      - "*/target/**"
      - "**/generated-sources/**"
  - name: JavadocDeclaration
  - name: MissingJavadoc

failureConditions:
  severityThresholds:
    any: 300
    critical: 5
    high: 50