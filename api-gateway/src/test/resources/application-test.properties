# Disable reactive Redis — RateLimitFilter uses @Autowired(required=false) proxyManager,
# so it safely passes through all requests when Redis is absent.
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration

# JWT — mock values; JWT validation skipped in tests (MockMvc/WebTestClient use spring-security-test)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/auth/realms/test/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/auth/realms/test

# Rate limiting disabled — proxyManager bean is absent (Redis excluded), filter passes through
rate-limiting.enabled=false

# Minimal routing — downstream services are not running in tests; 401 is returned by security
# filter before routing, so no real downstream connections are attempted
spring.cloud.gateway.routes[0].id=test-route
spring.cloud.gateway.routes[0].uri=http://localhost:9999
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/**

logging.level.root=WARN
logging.level.com.rewabank=DEBUG
