server:
  port: 8072
  error:
    include-message: never       # never expose internal error messages
    include-stacktrace: never

spring:
  application:
    name: api-gateway

  # ← CHANGED: removed config.import: configserver
  # Config comes from K8s ConfigMap mounted at /config/application.yml

  security:
    oauth2:
      resourceserver:
        jwt:
          # ← CHANGED: K8s DNS — keycloak service in keycloak namespace
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://keycloak-keycloakx-http.keycloak.svc.cluster.local:80/auth/realms/rewabank/protocol/openid-connect/certs}
          issuer-uri:  ${KEYCLOAK_ISSUER_URI:http://keycloak-keycloakx-http.keycloak.svc.cluster.local:80/auth/realms/rewabank}

  data:
    redis:
      # ← CHANGED: K8s DNS
      host: ${REDIS_HOST:valkey.banking.svc.cluster.local}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}   # injected from K8s Secret
      connect-timeout: 5s
      timeout: 5s

  cloud:
    gateway:
      # ← REMOVED: discovery.locator (was Eureka) — using explicit K8s DNS routes
      httpclient:
        connect-timeout: 1000
        response-timeout: 15s

# Rate limiting (bucket4j + Redis)
rate-limiting:
  enabled: true
  general:
    capacity: 5                    # 20 req/s per user — general API paths
    refill-period-seconds: 1
  financial:
    capacity: 5                     # 5 req/s per user — transactions + payments
    refill-period-seconds: 1
  auth:
    capacity: 5                    # 10 req/min per IP — login + register
    refill-period-seconds: 60

# CORS — override per environment via K8s ConfigMap
cors:
  allowed-origins:
    - ${CORS_ORIGIN_WEB:http://localhost:4200}
    - ${CORS_ORIGIN_MOBILE:http://localhost:3000}

# Resilience4j circuit breakers
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 20
        # Don't judge the failure rate until a real sample exists. A cold-start burst
        # of a handful of slow calls (Neon wakeup + JIT warm-up) must NOT open the breaker.
        minimum-number-of-calls: 20
        # Require a clear majority of failures, not a transient half, before tripping.
        failure-rate-threshold: 60
        # Recover fast once the downstream warms up (was 10s of blanket 503).
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
        # Only genuine downstream failures trip the breaker. Backend 4xx/5xx come back as
        # responses (not exceptions) and client-status exceptions must never count — only
        # timeouts (TimeLimiter) and transport/IO errors do. Replaces the old Java
        # recordException predicate; inherited by every instance via base-config: default.
        record-exceptions:
          - java.util.concurrent.TimeoutException
          - java.io.IOException
    instances:
      # Transactions — fast fail, no retry
      transactionsCircuitBreaker:
        base-config: default
        sliding-window-size: 20
        failure-rate-threshold: 40
      # Payments — fast fail, no retry
      paymentCircuitBreaker:
        base-config: default
        sliding-window-size: 20
        failure-rate-threshold: 40
      # Fraud — 3s timeout; window widened so a short burst can't pin the breaker open
      fraudCircuitBreaker:
        base-config: default
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 5
      # Accounts
      accountsCircuitBreaker:
        base-config: default
      # Auth
      authCircuitBreaker:
        base-config: default
      # Loans
      loansCircuitBreaker:
        base-config: default
  timelimiter:
    configs:
      default:
        timeout-duration: 4s
    instances:
      fraudCircuitBreaker:
        timeout-duration: 3s        # ← fraud must respond in 3s
      transactionsCircuitBreaker:
        timeout-duration: 10s       # transactions can take longer
      paymentCircuitBreaker:
        timeout-duration: 15s       # payments (NEFT/RTGS) can be slower
      authCircuitBreaker:
        timeout-duration: 15s       # register makes 4 Keycloak calls — needs extra time
      accountsCircuitBreaker:
        timeout-duration: 10s       # account creation involves Feign call to customers-service
      loansCircuitBreaker:
        timeout-duration: 10s
      cardsCircuitBreaker:
        timeout-duration: 10s
      customersCircuitBreaker:
        timeout-duration: 10s

# Actuator
management:
  endpoint:
    gateway:
      enabled: true
    health:
      show-details: always
      probes:
        enabled: true               # liveness + readiness for K8s
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway,refresh,circuitbreakers,circuitbreakerevents
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: ${OTEL_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector.monitoring.svc.cluster.local:4318/v1/traces}

logging:
  level:
    com.rewabank: INFO
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO
  pattern:
    level: "%5p[${spring.application.name},%X{traceId},%X{spanId}]"
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{rewabank-correlation-id}] [%X{traceId}] %-5level %logger{36} - %msg%n"

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

info:
  app:
    name: "RewaBank API Gateway"
    version: "1.0.0"
    description: "Central entry point for all RewaBank microservices"