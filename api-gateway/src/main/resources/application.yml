## ─────────────────────────────────────────────────────────────────────────────
## api-gateway — COMMON base config (profile-independent).
## Environment-specific endpoints/credentials live in application-{dev,prod}.yml.
## Active profile defaults to `prod`; override with SPRING_PROFILES_ACTIVE or
## -Dspring.profiles.active=dev for local development.
## ─────────────────────────────────────────────────────────────────────────────
server:
  port: 8072
  error:
    include-message: never       # never expose internal error messages
    include-stacktrace: never

spring:
  application:
    name: api-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}

  cloud:
    gateway:
      httpclient:
        connect-timeout: 1000
        # Global backstop — must be >= the largest per-route circuit-breaker time-limiter
        # (payments & transactions = 15s) so the per-route time-limiter always fires first
        # and returns the clean per-route fallback. See RESILIENCE-TIMEOUT-RETRY-AUDIT.md.
        response-timeout: 16s

# Rate limiting (bucket4j + Redis)
rate-limiting:
  enabled: true
  general:
    capacity: 5                    # 20 req/s per user — general API paths
    refill-period-seconds: 1
  financial:
    capacity: 5                     # 5 req/s per user — transactions + payments
    refill-period-seconds: 1
  auth:
    capacity: 5                    # 10 req/min per IP — login + register
    refill-period-seconds: 60

# Resilience4j circuit breakers
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 20
        # Don't judge the failure rate until a real sample exists. A cold-start burst
        # of a handful of slow calls (Neon wakeup + JIT warm-up) must NOT open the breaker.
        minimum-number-of-calls: 20
        # Require a clear majority of failures, not a transient half, before tripping.
        failure-rate-threshold: 60
        # Recover fast once the downstream warms up (was 10s of blanket 503).
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
        # Only genuine downstream failures trip the breaker. Backend 4xx/5xx come back as
        # responses (not exceptions) and client-status exceptions must never count — only
        # timeouts (TimeLimiter) and transport/IO errors do. Replaces the old Java
        # recordException predicate; inherited by every instance via base-config: default.
        record-exceptions:
          - java.util.concurrent.TimeoutException
          - java.io.IOException
    instances:
      # Transactions — fast fail, no retry
      transactionsCircuitBreaker:
        base-config: default
        sliding-window-size: 20
        failure-rate-threshold: 40
      # Payments — fast fail, no retry
      paymentCircuitBreaker:
        base-config: default
        sliding-window-size: 20
        failure-rate-threshold: 40
      # Fraud — 3s timeout; window widened so a short burst can't pin the breaker open
      fraudCircuitBreaker:
        base-config: default
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 5
      # Accounts
      accountsCircuitBreaker:
        base-config: default
      # Auth
      authCircuitBreaker:
        base-config: default
      # Loans
      loansCircuitBreaker:
        base-config: default
  timelimiter:
    configs:
      default:
        timeout-duration: 4s
    instances:
      fraudCircuitBreaker:
        timeout-duration: 3s        # ← fraud must respond in 3s
      transactionsCircuitBreaker:
        timeout-duration: 15s       # must cover the transfer saga (fraud 3s + debit 5s + credit 5s ~= 13s)
      paymentCircuitBreaker:
        timeout-duration: 15s       # payments (NEFT/RTGS) can be slower
      authCircuitBreaker:
        timeout-duration: 15s       # register makes 4 Keycloak calls — needs extra time
      accountsCircuitBreaker:
        timeout-duration: 10s       # account creation involves Feign call to customers-service
      loansCircuitBreaker:
        timeout-duration: 10s
      cardsCircuitBreaker:
        timeout-duration: 10s
      customersCircuitBreaker:
        timeout-duration: 10s

# Actuator
management:
  endpoint:
    gateway:
      enabled: true
    health:
      show-details: always
      probes:
        enabled: true               # liveness + readiness for K8s
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway,refresh,circuitbreakers,circuitbreakerevents
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true

logging:
  pattern:
    level: "%5p[${spring.application.name},%X{traceId},%X{spanId}]"
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{rewabank-correlation-id}] [%X{traceId}] %-5level %logger{36} - %msg%n"

info:
  app:
    name: "RewaBank API Gateway"
    version: "1.0.0"
    description: "Central entry point for all RewaBank microservices"