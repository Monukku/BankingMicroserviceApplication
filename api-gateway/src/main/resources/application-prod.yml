## ─────────────────────────────────────────────────────────────────────────────
## api-gateway — PROD profile (cloud managed services).
## Endpoints default to in-cluster K8s DNS; cloud targets are injected via env.
## ─────────────────────────────────────────────────────────────────────────────
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://keycloak-keycloakx-http.keycloak.svc.cluster.local:80/auth/realms/rewabank/protocol/openid-connect/certs}
          issuer-uri:  ${KEYCLOAK_ISSUER_URI:http://keycloak-keycloakx-http.keycloak.svc.cluster.local:80/auth/realms/rewabank}

  data:
    redis:
      host:            ${REDIS_HOST:valkey.banking.svc.cluster.local}
      port:            ${REDIS_PORT:6379}
      password:        ${REDIS_PASSWORD}   # injected from K8s Secret
      connect-timeout: 5s
      timeout:         5s

# CORS — override per environment
cors:
  allowed-origins:
    - ${CORS_ORIGIN_WEB:http://localhost:4200}
    - ${CORS_ORIGIN_MOBILE:http://localhost:3000}

management:
  tracing:
    sampling:
      probability: ${OTEL_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector.monitoring.svc.cluster.local:4318/v1/traces}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

logging:
  level:
    com.rewabank: INFO
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO