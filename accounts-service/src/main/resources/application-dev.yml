## ─────────────────────────────────────────────────────────────────────────────
## accounts-ms — DEV profile (local development).
## Activate with: -Dspring.profiles.active=dev
## ─────────────────────────────────────────────────────────────────────────────
spring:
  datasource:
    url:      ${DB_URL:jdbc:postgresql://localhost:5432/accounts_db}
    username: ${DB_USERNAME:accounts_user}
    password: ${DB_PASSWORD:accounts_pass}

  jpa:
    show-sql: true

  data:
    redis:
      host:     ${REDIS_HOST:localhost}
      port:     ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout:  2s

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri:  ${KEYCLOAK_ISSUER_URI:http://localhost:8080/auth/realms/rewabank}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8080/auth/realms/rewabank/protocol/openid-connect/certs}

customers:
  service:
    url: ${CUSTOMERS_SERVICE_URL:http://localhost:8080}

management:
  tracing:
    sampling:
      probability: ${OTEL_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_ENDPOINT:http://localhost:4318/v1/traces}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

logging:
  level:
    com.rewabank: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG