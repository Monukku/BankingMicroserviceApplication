## ─────────────────────────────────────────────────────────────────────────────
## accounts-ms — COMMON base config (profile-independent).
## Environment-specific endpoints/credentials live in application-{dev,prod}.yml.
## Active profile defaults to `prod`; override with SPRING_PROFILES_ACTIVE or
## -Dspring.profiles.active=dev for local development.
## ─────────────────────────────────────────────────────────────────────────────
server:
  port: 8081
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: accounts-ms
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      # 2s so the sequential budget fits the 8s Backend VS: 2s conn + 5s customers-Feign
      # (account create/KYC check) = 7s < 8s. Reads are far faster.
      connection-timeout: 2000
      idle-timeout: 600000
      keepalive-time: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:accounts-ms}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: ${KAFKA_MAX_POLL_RECORDS:50}
      properties:
        spring.json.trusted.packages: "com.rewabank,java.util,java.time,java.math"
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor

kafka:
  topics:
    kyc-verified:      bank.kyc.verified
    fraud-alert:       bank.fraud.alert.raised
    account-created:   bank.account.created
    account-activated: bank.account.activated
    account-frozen:    bank.account.frozen
    account-closed:    bank.account.closed
    balance-updated:   bank.balance.updated

internal:
  call:
    secret: ${INTERNAL_CALL_SECRET}

resilience4j:
  circuitbreaker:
    instances:
      customers-service:
        sliding-window-size: ${CB_SLIDING_WINDOW:10}
        failure-rate-threshold: ${CB_FAILURE_RATE:50}
        wait-duration-in-open-state: ${CB_WAIT_DURATION:10s}
        permitted-number-of-calls-in-half-open-state: 2
  timelimiter:
    instances:
      customers-service:
        timeout-duration: ${CB_TIMEOUT:5s}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    shutdown:
      enabled: false
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{rewabank-correlation-id}] [%X{traceId}] %-5level %logger{36} - %msg%n"