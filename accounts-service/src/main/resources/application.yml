server:
  port: 8081
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: accounts-ms
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgresql-rw.banking.svc.cluster.local:5432/accounts_db}
    username: ${DB_USERNAME:accounts_user}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 25
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      keepalive-time: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:valkey.banking.svc.cluster.local}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 2s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:kafka-kafka-bootstrap.banking.svc.cluster.local:9092}
    consumer:
      group-id: accounts-ms
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "com.rewabank,java.util,java.time,java.math"
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://keycloak-keycloakx-http.keycloak.svc.cluster.local:80/auth/realms/rewabank/protocol/openid-connect/certs}

kafka:
  topics:
    kyc-verified:      bank.kyc.verified
    fraud-alert:       bank.fraud.alert.raised
    account-created:   bank.account.created
    account-activated: bank.account.activated
    account-frozen:    bank.account.frozen
    account-closed:    bank.account.closed
    balance-updated:   bank.balance.updated

customers:
  service:
    url: ${CUSTOMERS_SERVICE_URL:http://customers-service.banking.svc.cluster.local:8080}

resilience4j:
  circuitbreaker:
    instances:
      customers-service:
        sliding-window-size: ${CB_SLIDING_WINDOW:10}
        failure-rate-threshold: ${CB_FAILURE_RATE:50}
        wait-duration-in-open-state: ${CB_WAIT_DURATION:10s}
        permitted-number-of-calls-in-half-open-state: 2
  timelimiter:
    instances:
      customers-service:
        timeout-duration: ${CB_TIMEOUT:5s}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    shutdown:
      enabled: false
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_ENDPOINT:http://otel-collector.monitoring.svc.cluster.local:4318/v1/traces}

logging:
  level:
    com.rewabank: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{rewabank-correlation-id}] [%X{traceId}] %-5level %logger{36} - %msg%n"