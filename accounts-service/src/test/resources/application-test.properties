# H2 Database Configuration for Testing
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (optional, for debugging)
spring.h2.console.enabled=true

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Redis Configuration (disabled for testing)
spring.redis.host=localhost
spring.redis.port=6379

# Disable Spring Data Redis repositories for tests
spring.data.redis.repositories.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration,org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

# Flyway Configuration (disable migrations for test)
spring.flyway.enabled=false

# Kafka Configuration (disable for tests)
spring.kafka.enabled=false
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.enabled=false
spring.kafka.producer.enabled=false
spring.kafka.admin.enabled=false
spring.kafka.listener.enabled=false

# OAuth2 JWT Configuration - Mock values for tests
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/auth/realms/test
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/auth/realms/test/protocol/openid-connect/certs

# Logging
logging.level.root=WARN
logging.level.com.rewabank=DEBUG

# Disable caching for tests
spring.cache.type=none
