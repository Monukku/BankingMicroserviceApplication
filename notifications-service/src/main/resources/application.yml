server:
  port: 9010
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: notifications-ms

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://mongodb-service.banking.svc.cluster.local:27017/notifications_db}
      auto-index-creation: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:kafka-kafka-bootstrap.banking.svc.cluster.local:9092}
    consumer:
      group-id: notifications-ms
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.rewabank,java.util,java.time,java.math"

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak-keycloakx-http.keycloak.svc.cluster.local:80/auth/realms/rewabank}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://keycloak-keycloakx-http.keycloak.svc.cluster.local:80/auth/realms/rewabank/protocol/openid-connect/certs}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_ENDPOINT:http://otel-collector.monitoring.svc.cluster.local:4318/v1/traces}

# ── Notification provider config ─────────────────────────────────────────────
# Set simulation.mode=false in production and supply provider credentials.
notification:
  simulation:
    mode: ${NOTIFICATION_SIMULATION_MODE:true}
  sms:
    provider: ${SMS_PROVIDER:log}           # log | twilio | aws-sns
    twilio-account-sid: ${TWILIO_ACCOUNT_SID:}
    twilio-auth-token: ${TWILIO_AUTH_TOKEN:}
    twilio-from-number: ${TWILIO_FROM_NUMBER:}
  email:
    provider: ${EMAIL_PROVIDER:log}         # log | smtp | aws-ses | sendgrid
    from-address: ${EMAIL_FROM:noreply@rewabank.com}
    sendgrid-api-key: ${SENDGRID_API_KEY:}
  push:
    provider: ${PUSH_PROVIDER:log}          # log | fcm
    fcm-server-key: ${FCM_SERVER_KEY:}

logging:
  level:
    com.rewabank: INFO
    org.springframework.kafka: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{traceId}] %-5level %logger{36} - %msg%n"