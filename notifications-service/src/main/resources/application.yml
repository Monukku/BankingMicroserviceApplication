## ─────────────────────────────────────────────────────────────────────────────
## notifications-ms — COMMON base config (profile-independent).
## Environment-specific endpoints/credentials live in application-{dev,prod}.yml.
## Active profile defaults to `prod`; override with SPRING_PROFILES_ACTIVE or
## -Dspring.profiles.active=dev for local development.
## ─────────────────────────────────────────────────────────────────────────────
server:
  port: 9010
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: notifications-ms
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}

  data:
    mongodb:
      auto-index-creation: true

  kafka:
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:notifications-ms}
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: ${KAFKA_MAX_POLL_RECORDS:50}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.rewabank,java.util,java.time,java.math"
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor

# ── Notification provider config ─────────────────────────────────────────────
# Set notification.simulation.mode=false in prod and supply provider credentials.
kafka:
  consumer:
    groups:
      accounts:     ${KAFKA_NOTIF_ACCOUNTS_GROUP:notifications-ms-accounts}
      transactions: ${KAFKA_NOTIF_TXN_GROUP:notifications-ms-transactions}
      balance:      ${KAFKA_NOTIF_BALANCE_GROUP:notifications-ms-balance}
      fraud:        ${KAFKA_NOTIF_FRAUD_GROUP:notifications-ms-fraud}
      loans:        ${KAFKA_NOTIF_LOANS_GROUP:notifications-ms-loans}
      payments:     ${KAFKA_NOTIF_PAYMENTS_GROUP:notifications-ms-payments}
      cards:        ${KAFKA_NOTIF_CARDS_GROUP:notifications-ms-cards}
      users:        ${KAFKA_NOTIF_USERS_GROUP:notifications-ms-users}

notification:
  simulation:
    mode: ${NOTIFICATION_SIMULATION_MODE:true}
  sms:
    provider: ${SMS_PROVIDER:log}           # log | twilio | aws-sns
    twilio-account-sid: ${TWILIO_ACCOUNT_SID:}
    twilio-auth-token: ${TWILIO_AUTH_TOKEN:}
    twilio-from-number: ${TWILIO_FROM_NUMBER:}
  email:
    provider: ${EMAIL_PROVIDER:log}         # log | smtp | aws-ses | sendgrid
    from-address: ${EMAIL_FROM:noreply@rewabank.com}
    sendgrid-api-key: ${SENDGRID_API_KEY:}
  push:
    provider: ${PUSH_PROVIDER:log}          # log | fcm
    fcm-server-key: ${FCM_SERVER_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{rewabank-correlation-id}] [%X{traceId}] %-5level %logger{36} - %msg%n"