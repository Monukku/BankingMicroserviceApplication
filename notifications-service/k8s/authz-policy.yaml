# Notifications MS accepts NO direct HTTP calls
# Only Kafka events — no AuthorizationPolicy needed for HTTP
# Monitoring namespace can scrape actuator
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: notifications-ms-policy
  namespace: banking
spec:
  selector:
    matchLabels:
      app: notifications-ms
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces: ["monitoring"]
      to:
        - operation:
            paths: ["/actuator/health", "/actuator/prometheus"]