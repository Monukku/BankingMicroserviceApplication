## ─────────────────────────────────────────────────────────────────────────────
## cards-ms — DEV profile (local development).
## Activate with: -Dspring.profiles.active=dev
## ─────────────────────────────────────────────────────────────────────────────
spring:
  datasource:
    url:      ${DB_URL:jdbc:postgresql://localhost:5432/cards_db}
    username: ${DB_USERNAME:cards_user}
    password: ${DB_PASSWORD:cards_pass}

  jpa:
    show-sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8080/auth/realms/rewabank/protocol/openid-connect/certs}
          issuer-uri:  ${KEYCLOAK_ISSUER_URI:http://localhost:8080/auth/realms/rewabank}

feign:
  customers-ms:
    url: ${CUSTOMERS_SERVICE_URL:http://localhost:8080}
  accounts-ms:
    url: ${ACCOUNTS_SERVICE_URL:http://localhost:8081}
  fraud-ms:
    url: ${FRAUD_SERVICE_URL:http://localhost:8094}
  notification-ms:
    url: ${NOTIFICATIONS_SERVICE_URL:http://localhost:9010}

management:
  tracing:
    sampling:
      probability: ${OTEL_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

logging:
  level:
    com.rewabank: DEBUG