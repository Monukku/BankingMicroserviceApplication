server:
  port: 8092
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: cards-ms
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
        group:
          enabled: true   # CB instance name = @FeignClient name (e.g. fraud-ms), not full method signature

  datasource:
    url: ${DB_URL:jdbc:postgresql://postgresql-rw.banking.svc.cluster.local:5432/cards_db}
    username: ${DB_USERNAME:cards_user}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      # Explicit 3s (was Hikari's 30s default): fail internally inside the 10s Backend VS.
      connection-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:kafka-kafka-bootstrap.banking.svc.cluster.local:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:cards-ms}
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: ${KAFKA_MAX_POLL_RECORDS:50}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.rewabank,java.util,java.time,java.math"
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWKS_URI}
          issuer-uri: ${KEYCLOAK_ISSUER_URI}

feign:
  customers-ms:
    url: ${CUSTOMERS_SERVICE_URL:http://customers-service.banking.svc.cluster.local:8080}
  accounts-ms:
    url: ${ACCOUNTS_SERVICE_URL:http://accounts-service.banking.svc.cluster.local:8081}
  fraud-ms:
    url: ${FRAUD_SERVICE_URL:http://fraud-service.banking.svc.cluster.local:8094}
  notification-ms:
    url: ${NOTIFICATIONS_SERVICE_URL:http://notifications-service.banking.svc.cluster.local:9010}

encryption:
  aes-key: ${AES_ENCRYPTION_KEY}

kafka:
  topics:
    card-issued:  bank.card.issued
    card-blocked: bank.card.blocked
  consumer:
    groups:
      fraud: ${KAFKA_CARDS_FRAUD_GROUP:cards-ms-fraud}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true

  tracing:
    sampling:
      probability: ${OTEL_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector.monitoring.svc.cluster.local:4318/v1/traces}

resilience4j:
  circuitbreaker:
    instances:
      fraud-ms:
        sliding-window-size: ${CB_FRAUD_WINDOW:5}
        failure-rate-threshold: ${CB_FRAUD_FAILURE_RATE:30}
        wait-duration-in-open-state: ${CB_FRAUD_WAIT:5s}
        permitted-number-of-calls-in-half-open-state: 2
  timelimiter:
    instances:
      fraud-ms:
        timeout-duration: ${CB_FRAUD_TIMEOUT:1s}

card:
  cvv:
    bcrypt-strength: 5   # 2^5=32 iterations — fast for CVV verification on every transaction

logging:
  level:
    com.rewabank: INFO
  pattern:
    level: "%5p[${spring.application.name},%X{traceId},%X{spanId}]"
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{traceId}] %-5level %logger{36} - %msg%n"
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
