## ─────────────────────────────────────────────────────────────────────────────
## cards-ms — COMMON base config (profile-independent).
## Environment-specific endpoints/credentials live in application-{dev,prod}.yml.
## Active profile defaults to `prod`; override with SPRING_PROFILES_ACTIVE or
## -Dspring.profiles.active=dev for local development.
## ─────────────────────────────────────────────────────────────────────────────
server:
  port: 8092
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: cards-ms
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
        group:
          enabled: true   # CB instance name = @FeignClient name (e.g. fraud-ms), not full method signature

  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      # Explicit 3s (was Hikari's 30s default): fail internally inside the 10s Backend VS.
      connection-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:cards-ms}
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: ${KAFKA_MAX_POLL_RECORDS:50}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.rewabank,java.util,java.time,java.math"
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor

encryption:
  aes-key: ${AES_ENCRYPTION_KEY}

kafka:
  topics:
    card-issued:  bank.card.issued
    card-blocked: bank.card.blocked
  consumer:
    groups:
      fraud: ${KAFKA_CARDS_FRAUD_GROUP:cards-ms-fraud}

resilience4j:
  circuitbreaker:
    instances:
      fraud-ms:
        sliding-window-size: ${CB_FRAUD_WINDOW:5}
        failure-rate-threshold: ${CB_FRAUD_FAILURE_RATE:30}
        wait-duration-in-open-state: ${CB_FRAUD_WAIT:5s}
        permitted-number-of-calls-in-half-open-state: 2
  timelimiter:
    instances:
      fraud-ms:
        timeout-duration: ${CB_FRAUD_TIMEOUT:1s}

card:
  cvv:
    bcrypt-strength: 5   # 2^5=32 iterations — fast for CVV verification on every transaction

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true

logging:
  pattern:
    level: "%5p[${spring.application.name},%X{traceId},%X{spanId}]"
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{traceId}] %-5level %logger{36} - %msg%n"