apiVersion: apps/v1
kind: Deployment
metadata:
  name: cards-ms
  namespace: banking
  labels:
    app: cards-ms
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cards-ms
  template:
    metadata:
      labels:
        app: cards-ms
        version: v1
      annotations:
        sidecar.istio.io/inject: "true"
        prometheus.io/scrape: "true"
        prometheus.io/port: "8092"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: cards-ms-sa
      containers:
        - name: cards-ms
          image: rewabank/rewabank-cards-ms:latest
          ports:
            - containerPort: 8092
          envFrom:
            - configMapRef:
                name: cards-ms-config
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: cards-db-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cards-db-secret
                  key: password
            - name: AES_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: encryption-secret
                  key: aes-key
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8092
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8092
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3