apiVersion: v1
kind: ServiceAccount
metadata:
  name: loans-ms-sa
  namespace: banking
  labels:
    app: loans-ms
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loans-ms-config
  namespace: banking
data:
  DB_URL:               "jdbc:postgresql://postgresql-rw.banking.svc.cluster.local:5432/loans_db"
  KAFKA_BOOTSTRAP:      "kafka-kafka-bootstrap.banking.svc.cluster.local:9092"
  KEYCLOAK_ISSUER_URI:  "http://keycloak-keycloakx-http.keycloak.svc.cluster.local:80/auth/realms/rewabank"
  KEYCLOAK_JWKS_URI:    "http://keycloak-keycloakx-http.keycloak.svc.cluster.local:80/auth/realms/rewabank/protocol/openid-connect/certs"
  REDIS_HOST:           "valkey.banking.svc.cluster.local"
  REDIS_PORT:           "6379"
  ACCOUNTS_SERVICE_URL: "http://accounts-service.banking.svc.cluster.local:8081"
  CUSTOMERS_SERVICE_URL: "http://customers-service.banking.svc.cluster.local:8080"
  FRAUD_SERVICE_URL:    "http://fraud-service.banking.svc.cluster.local:8094"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loans-ms
  namespace: banking
  labels:
    app: loans-ms
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loans-ms
  template:
    metadata:
      labels:
        app: loans-ms
        version: v1
      annotations:
        sidecar.istio.io/inject: "true"
        prometheus.io/scrape: "true"
        prometheus.io/port: "8090"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: loans-ms-sa
      containers:
        - name: loans-ms
          image: ghcr.io/rewabank/loans-service:latest
          ports:
            - containerPort: 8090
          envFrom:
            - configMapRef:
                name: loans-ms-config
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: loans-db-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: loans-db-secret
                  key: password
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8090
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8090
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: loans-service
  namespace: banking
  labels:
    app: loans-ms
spec:
  selector:
    app: loans-ms
  ports:
    - name: http
      port: 8090
      targetPort: 8090
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: loans-ms-hpa
  namespace: banking
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: loans-ms
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: loans-ms-pdb
  namespace: banking
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: loans-ms