apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-ms-sa
  namespace: banking
  labels:
    app: auth-ms
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-ms-config
  namespace: banking
data:
  DB_URL:               "jdbc:postgresql://postgresql-rw.banking.svc.cluster.local:5432/auth_db"
  REDIS_HOST:           "valkey.banking.svc.cluster.local"
  KAFKA_BOOTSTRAP:      "kafka-kafka-bootstrap.banking.svc.cluster.local:9092"
  KEYCLOAK_URL:         "http://keycloak-keycloakx-http.keycloak.svc.cluster.local:80/auth"
  KEYCLOAK_REALM:       "rewabank"
  KEYCLOAK_JWKS_URI:    "http://keycloak-keycloakx-http.keycloak.svc.cluster.local:80/auth/realms/rewabank/protocol/openid-connect/certs"
  KEYCLOAK_ISSUER_URI:  "http://keycloak-keycloakx-http.keycloak.svc.cluster.local:80/auth/realms/rewabank"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-ms
  namespace: banking
  labels:
    app: auth-ms
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-ms
  template:
    metadata:
      labels:
        app: auth-ms
        version: v1
      annotations:
        sidecar.istio.io/inject: "true"
        prometheus.io/scrape: "true"
        prometheus.io/port:   "8073"
        prometheus.io/path:   "/actuator/prometheus"
    spec:
      serviceAccountName: auth-ms-sa
      containers:
        - name: auth-ms
          image: ghcr.io/rewabank/auth-service:latest
          ports:
            - containerPort: 8073
          envFrom:
            - configMapRef:
                name: auth-ms-config
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: auth-db-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-db-secret
                  key: password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: password
            - name: KEYCLOAK_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: keycloak-ms-secret
                  key: client-id
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-ms-secret
                  key: client-secret
            - name: OTEL_ENDPOINT
              value: "http://otel-collector.monitoring.svc.cluster.local:4318/v1/traces"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8073
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8073
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: banking
  labels:
    app: auth-ms
spec:
  selector:
    app: auth-ms
  ports:
    - name: http
      port: 8073
      targetPort: 8073
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: auth-ms-hpa
  namespace: banking
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: auth-ms
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: auth-ms-pdb
  namespace: banking
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: auth-ms