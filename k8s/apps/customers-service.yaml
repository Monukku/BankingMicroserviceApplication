apiVersion: v1
kind: ServiceAccount
metadata:
  name: customers-ms-sa
  namespace: banking
  labels:
    app: customers-ms
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: customers-ms-config
  namespace: banking
data:
  DB_URL:            "jdbc:postgresql://postgresql-rw.banking.svc.cluster.local:5432/customers_db"
  REDIS_HOST:        "valkey.banking.svc.cluster.local"
  KAFKA_BOOTSTRAP:   "kafka-kafka-bootstrap.banking.svc.cluster.local:9092"
  KEYCLOAK_JWKS_URI: "http://keycloak-keycloakx-http.keycloak.svc.cluster.local:80/auth/realms/rewabank/protocol/openid-connect/certs"
  MINIO_URL:         "http://minio-service.banking.svc.cluster.local:9000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customers-ms
  namespace: banking
  labels:
    app: customers-ms
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customers-ms
  template:
    metadata:
      labels:
        app: customers-ms
        version: v1
      annotations:
        sidecar.istio.io/inject: "true"
        prometheus.io/scrape: "true"
        prometheus.io/port:   "8080"
        prometheus.io/path:   "/actuator/prometheus"
    spec:
      serviceAccountName: customers-ms-sa
      containers:
        - name: customers-ms
          image: ghcr.io/rewabank/customers-service:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: customers-ms-config
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: customers-db-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: customers-db-secret
                  key: password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: password
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: secret-key
            - name: AES_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: encryption-secret
                  key: aes-key
          resources:
            requests:
              memory: "256Mi"
              cpu:    "250m"
            limits:
              memory: "512Mi"
              cpu:    "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: customers-service
  namespace: banking
  labels:
    app: customers-ms
spec:
  selector:
    app: customers-ms
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: customers-ms-hpa
  namespace: banking
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: customers-ms
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: customers-ms-pdb
  namespace: banking
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: customers-ms