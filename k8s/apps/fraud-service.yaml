apiVersion: v1
kind: ServiceAccount
metadata:
  name: fraud-ms-sa
  namespace: banking
  labels:
    app: fraud-ms
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fraud-ms-config
  namespace: banking
data:
  DB_URL:            "jdbc:postgresql://ep-spring-bar-az9ane6a-pooler.c-3.ap-southeast-1.aws.neon.tech:5432/fraud_db?sslmode=require"
  REDIS_HOST:        "valkey.banking.svc.cluster.local"
  KAFKA_BOOTSTRAP:   "kafka-kafka-bootstrap.banking.svc.cluster.local:9092"
  KEYCLOAK_JWKS_URI: "http://keycloak-keycloakx-http.keycloak.svc.cluster.local/auth/realms/rewabank/protocol/openid-connect/certs"
  KEYCLOAK_ISSUER_URI: "https://api.rewarealm.com/auth/realms/rewabank"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-ms
  namespace: banking
  labels:
    app: fraud-ms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fraud-ms
  template:
    metadata:
      labels:
        app: fraud-ms
      annotations:
        sidecar.istio.io/inject: "true"
        prometheus.io/scrape: "true"
        prometheus.io/port:   "8094"
        prometheus.io/path:   "/actuator/prometheus"
    spec:
      serviceAccountName: fraud-ms-sa
      containers:
        - name: fraud-ms
          image: rewabank/fraud-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8094
          envFrom:
            - configMapRef:
                name: fraud-ms-config
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: fraud-db-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fraud-db-secret
                  key: password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: password
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms192m -Xmx384m -XX:+UseG1GC"
          resources:
            requests:
              memory: "256Mi"
              cpu:    "500m"
            limits:
              memory: "640Mi"
              cpu:    "1000m"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8094
            failureThreshold: 36
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8094
            initialDelaySeconds: 5
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8094
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: fraud-service
  namespace: banking
  labels:
    app: fraud-ms
spec:
  selector:
    app: fraud-ms
  ports:
    - name: http
      port: 8094
      targetPort: 8094
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fraud-ms-hpa
  namespace: banking
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fraud-ms
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fraud-ms-pdb
  namespace: banking
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: fraud-ms
