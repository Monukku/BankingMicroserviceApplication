apiVersion: v1
kind: ServiceAccount
metadata:
  name: audit-ms-sa
  namespace: banking
  labels:
    app: audit-ms
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: audit-ms-config
  namespace: banking
data:
  DB_URL:            "jdbc:postgresql://postgresql-rw.banking.svc.cluster.local:5432/audit_db"
  KAFKA_BOOTSTRAP:   "kafka-kafka-bootstrap.banking.svc.cluster.local:9092"
  KEYCLOAK_JWKS_URI: "http://keycloak-keycloakx-http.keycloak.svc.cluster.local:80/auth/realms/rewabank/protocol/openid-connect/certs"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-ms
  namespace: banking
  labels:
    app: audit-ms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audit-ms
  template:
    metadata:
      labels:
        app: audit-ms
      annotations:
        sidecar.istio.io/inject: "true"
        prometheus.io/scrape: "true"
        prometheus.io/port:   "9011"
        prometheus.io/path:   "/actuator/prometheus"
    spec:
      serviceAccountName: audit-ms-sa
      containers:
        - name: audit-ms
          image: rewabank/audit-service:latest
          ports:
            - containerPort: 9011
          envFrom:
            - configMapRef:
                name: audit-ms-config
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: audit-db-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: audit-db-secret
                  key: password
          resources:
            requests:
              memory: "256Mi"
              cpu:    "250m"
            limits:
              memory: "512Mi"
              cpu:    "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9011
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9011
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: audit-service
  namespace: banking
  labels:
    app: audit-ms
spec:
  selector:
    app: audit-ms
  ports:
    - name: http
      port: 9011
      targetPort: 9011
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: audit-ms-hpa
  namespace: banking
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: audit-ms
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: audit-ms-pdb
  namespace: banking
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: audit-ms