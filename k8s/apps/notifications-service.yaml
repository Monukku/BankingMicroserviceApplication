apiVersion: v1
kind: ServiceAccount
metadata:
  name: notifications-ms-sa
  namespace: banking
  labels:
    app: notifications-ms
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: notifications-ms-config
  namespace: banking
data:
  KAFKA_BOOTSTRAP:   "kafka-kafka-bootstrap.banking.svc.cluster.local:9092"
  KEYCLOAK_JWKS_URI: "http://keycloak-keycloakx-http.keycloak.svc.cluster.local/auth/realms/rewabank/protocol/openid-connect/certs"
  KEYCLOAK_ISSUER_URI: "https://api.rewarealm.com/auth/realms/rewabank"
  # Notification delivery (non-secret knobs; credentials live in the resend-secret Secret).
  # simulation.mode is GLOBAL: false = real email via Resend; SMS_PROVIDER=log keeps SMS log-only.
  NOTIFICATION_SIMULATION_MODE: "false"
  EMAIL_PROVIDER:               "resend"
  SMS_PROVIDER:                 "log"
  PUSH_PROVIDER:                "log"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications-ms
  namespace: banking
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  labels:
    app: notifications-ms
spec:
  replicas: 1   # enabled for Resend email delivery. HPA still removed (see note below), so this count holds. Set to 0 to park again.
  selector:
    matchLabels:
      app: notifications-ms
  template:
    metadata:
      labels:
        app: notifications-ms
      annotations:
        sidecar.istio.io/inject: "true"
        prometheus.io/scrape: "true"
        prometheus.io/port:   "9010"
        prometheus.io/path:   "/actuator/prometheus"
    spec:
      serviceAccountName: notifications-ms-sa
      containers:
        - name: notifications-ms
          image: rewabank/notifications-service@sha256:a26d2fea823a26fda80d520cba5281f438dbeda284e8ad896eee957601af9a28
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9010
          envFrom:
            - configMapRef:
                name: notifications-ms-config
          env:
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: mongodb-atlas-secret
                  key: notifications-uri
            # Resend email credentials — Secret created out-of-band (NOT committed):
            #   kubectl create secret generic resend-secret -n banking \
            #     --from-literal=api-key='re_xxx' \
            #     --from-literal=from-email='RewaBank <notifications@mail.rewarealm.com>'
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: resend-secret
                  key: api-key
            - name: EMAIL_FROM
              valueFrom:
                secretKeyRef:
                  name: resend-secret
                  key: from-email
          resources:
            requests:
              memory: "256Mi"
              cpu:    "250m"
            limits:
              memory: "512Mi"
              cpu:    "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9010
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9010
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: notifications-service
  namespace: banking
  labels:
    app: notifications-ms
spec:
  selector:
    app: notifications-ms
  ports:
    - name: http
      port: 9010
      targetPort: 9010
  type: ClusterIP
# NOTE: HorizontalPodAutoscaler removed — it had minReplicas:1, which would
# override replicas:0 above and scale the service back up. Restore it (git
# history) together with replicas:1 when re-enabling notifications-ms.
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: notifications-ms-pdb
  namespace: banking
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: notifications-ms
