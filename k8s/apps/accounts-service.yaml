apiVersion: v1
kind: ServiceAccount
metadata:
  name: accounts-ms-sa
  namespace: banking
  labels:
    app: accounts-ms
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: accounts-ms-config
  namespace: banking
data:
  DB_URL:                "jdbc:postgresql://postgresql-rw.banking.svc.cluster.local:5432/accounts_db"
  REDIS_HOST:            "valkey.banking.svc.cluster.local"
  KAFKA_BOOTSTRAP:       "kafka-kafka-bootstrap.banking.svc.cluster.local:9092"
  KEYCLOAK_JWKS_URI:     "http://keycloak-keycloakx-http.keycloak.svc.cluster.local/auth/realms/rewabank/protocol/openid-connect/certs"
  CUSTOMERS_SERVICE_URL: "http://customers-service.banking.svc.cluster.local:8080"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounts-ms
  namespace: banking
  labels:
    app: accounts-ms
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: accounts-ms
  template:
    metadata:
      labels:
        app: accounts-ms
        version: v1
      annotations:
        sidecar.istio.io/inject: "true"
        prometheus.io/scrape: "true"
        prometheus.io/port:   "8081"
        prometheus.io/path:   "/actuator/prometheus"
    spec:
      serviceAccountName: accounts-ms-sa
      containers:
        - name: accounts-ms
          image: rewabank/accounts-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: accounts-ms-config
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: accounts-db-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: accounts-db-secret
                  key: password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: password
          resources:
            requests:
              memory: "256Mi"
              cpu:    "250m"
            limits:
              memory: "512Mi"
              cpu:    "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 120
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: accounts-service
  namespace: banking
  labels:
    app: accounts-ms
spec:
  selector:
    app: accounts-ms
  ports:
    - name: http
      port: 8081
      targetPort: 8081
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: accounts-ms-hpa
  namespace: banking
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: accounts-ms
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: accounts-ms-pdb
  namespace: banking
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: accounts-ms