podAnnotations:
  sidecar.istio.io/rewriteAppHTTPProbers: "false"

command:
  - "/opt/keycloak/bin/kc.sh"
  - "start-dev"
  - "--db=postgres"
  - "--db-url=$(KC_DB_URL)"
extraEnv: |
  - name: KC_DB_URL
    valueFrom:
      secretKeyRef:
        name: keycloak-db-secret
        key: db-url
  - name: KEYCLOAK_ADMIN
    valueFrom:
      secretKeyRef:
        name: keycloak-admin-secret
        key: username
  - name: KEYCLOAK_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: keycloak-admin-secret
        key: password
  - name: KC_DB_USERNAME
    valueFrom:
      secretKeyRef:
        name: keycloak-db-secret
        key: username
  - name: KC_DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: keycloak-db-secret
        key: password
startupProbe: |
  httpGet:
    path: /auth/health/live
    port: 9000
    scheme: HTTP
  initialDelaySeconds: 30
  timeoutSeconds: 1
  failureThreshold: 120
  periodSeconds: 5
readinessProbe: |
  httpGet:
    path: /auth/health/ready
    port: 9000
    scheme: HTTP
  initialDelaySeconds: 60
  timeoutSeconds: 1
  failureThreshold: 3
  periodSeconds: 10
livenessProbe: |
  httpGet:
    path: /auth/health/live
    port: 9000
    scheme: HTTP
  initialDelaySeconds: 120
  timeoutSeconds: 1
  failureThreshold: 3
  periodSeconds: 10
resources:
  requests:
    memory: 512Mi
    cpu: 250m
  limits:
    memory: 1Gi