apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: banking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: valkey
  template:
    metadata:
      labels:
        app: valkey
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:8
          ports:
            - containerPort: 6379
          args: ["--requirepass", "redis@2024"]
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: banking
spec:
  selector:
    app: valkey
  ports:
    - port: 6379
      targetPort: 6379