# notifications-ms is a pure Kafka consumer — no synchronous HTTP callers
# BUG FIX: original destination-rule.yaml and virtual-service.yaml both pointed to
# accounts-service (copy-paste error) — corrected to notifications-service below
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: notifications-ms-dr
  namespace: banking
spec:
  host: notifications-service.banking.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http2MaxRequests: 1000
        maxRequestsPerConnection: 10
    outlierDetection:
      consecutiveGatewayErrors: 5
      interval: 10s
      baseEjectionTime: 30s
---
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: notifications-ms-mtls
  namespace: banking
spec:
  selector:
    matchLabels:
      app: notifications-ms
  mtls:
    mode: STRICT
---
# Only monitoring may reach this service — no REST API consumers
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: notifications-ms-policy
  namespace: banking
spec:
  selector:
    matchLabels:
      app: notifications-ms
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces: ["monitoring"]
      to:
        - operation:
            paths: ["/actuator/health", "/actuator/prometheus"]