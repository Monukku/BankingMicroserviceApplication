# BUG FIX: original destination-rule.yaml and virtual-service.yaml both pointed to
# accounts-service (copy-paste error) — corrected to audit-service below
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: audit-ms-vs
  namespace: banking
spec:
  hosts:
    - audit-service.banking.svc.cluster.local
  http:
    - match:
        - uri:
            prefix: /api/v1/audit
      timeout: 10s
      retries:
        attempts: 2
        retryOn: gateway-error,reset
        perTryTimeout: 5s
      route:
        - destination:
            host: audit-service.banking.svc.cluster.local
            port:
              number: 9011
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: audit-ms-dr
  namespace: banking
spec:
  host: audit-service.banking.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http2MaxRequests: 1000
        maxRequestsPerConnection: 10
    outlierDetection:
      consecutiveGatewayErrors: 5
      interval: 10s
      baseEjectionTime: 30s
---
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: audit-ms-mtls
  namespace: banking
spec:
  selector:
    matchLabels:
      app: audit-ms
  mtls:
    mode: STRICT
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: audit-ms-policy
  namespace: banking
spec:
  selector:
    matchLabels:
      app: audit-ms
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/banking/sa/api-gateway-sa"
      to:
        - operation:
            methods: ["GET"]
            paths: ["/api/v1/audit/*"]
    - from:
        - source:
            namespaces: ["monitoring"]
      to:
        - operation:
            paths: ["/actuator/health", "/actuator/prometheus"]