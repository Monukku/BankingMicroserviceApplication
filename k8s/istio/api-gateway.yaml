# Istio Gateway — entry point for all external traffic.
#
# HTTPS is handled by Cloudflare Tunnel at the edge — this gateway stays on HTTP port 80.
# Cloudflare → cloudflared (on laptop) → localhost:80 → here → services
#
# If moving to a cloud server without Cloudflare Tunnel, switch to HTTPS by:
#   1. Installing cert-manager + applying k8s/tls-certificate.yaml (Let's Encrypt section)
#   2. Replacing the server block below with the HTTPS + redirect config
#   3. Updating hosts from "*" to your real domain
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: rewabank-gateway
  namespace: istio-system
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*"
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: rewabank-ingress-vs
  namespace: banking
spec:
  hosts:
    - "*"
  gateways:
    - istio-system/rewabank-gateway
  http:
    - match:
        - uri:
            prefix: /auth
      route:
        - destination:
            host: keycloak-keycloakx-http.keycloak.svc.cluster.local
            port:
              number: 80
      timeout: 30s
    # Payments — ingress timeout must sit ABOVE the gateway payment time-limiter (15s)
    # so the gateway fails first with its fallback; otherwise the client is told it failed
    # while the gateway may still be completing the payment (write!). retries 0 — never
    # retry a payment. See RESILIENCE-TIMEOUT-RETRY-AUDIT.md.
    - match:
        - uri:
            prefix: /api/v1/payments
      timeout: 18s
      retries:
        attempts: 0
      route:
        - destination:
            host: api-gateway-service.banking.svc.cluster.local
            port:
              number: 8072
    # Transactions — ingress 12s > gateway time-limiter 10s (margin, not a tie). retries 0.
    - match:
        - uri:
            prefix: /api/v1/transactions
      timeout: 12s
      retries:
        attempts: 0
      route:
        - destination:
            host: api-gateway-service.banking.svc.cluster.local
            port:
              number: 8072
    - match:
        - uri:
            prefix: /api/v1/kyc
      timeout: 60s
      retries:
        attempts: 0
      route:
        - destination:
            host: api-gateway-service.banking.svc.cluster.local
            port:
              number: 8072
    - match:
        - uri:
            prefix: /api/v1
      route:
        - destination:
            host: api-gateway-service.banking.svc.cluster.local
            port:
              number: 8072
      timeout: 30s
      # retries owned by the per-service backend VirtualServices (one retry layer only).
      # The old attempts:2 here nested over the backend VS retry (e.g. accounts 2x),
      # multiplying load on a sick service, and retried gateway-error 503s (incl. the
      # circuit breaker's own fallback). See RESILIENCE-TIMEOUT-RETRY-AUDIT.md.
      retries:
        attempts: 0
---
# Internal mesh VirtualService — controls behaviour for service-to-service calls to api-gateway
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: api-gateway-vs
  namespace: banking
spec:
  hosts:
    - api-gateway-service.banking.svc.cluster.local
  http:
    - match:
        - uri:
            prefix: /api/v1/transactions
      timeout: 10s
      retries:
        attempts: 0
      route:
        - destination:
            host: api-gateway-service.banking.svc.cluster.local
    - match:
        - uri:
            prefix: /api/v1/payments
      timeout: 15s
      retries:
        attempts: 0
      route:
        - destination:
            host: api-gateway-service.banking.svc.cluster.local
    - match:
        - uri:
            prefix: /api/v1/fraud
      timeout: 3s
      retries:
        attempts: 1
        retryOn: gateway-error,reset
      route:
        - destination:
            host: api-gateway-service.banking.svc.cluster.local
    - match:
        - uri:
            prefix: /api/v1/kyc
      timeout: 60s
      retries:
        attempts: 0
      route:
        - destination:
            host: api-gateway-service.banking.svc.cluster.local
    - route:
        - destination:
            host: api-gateway-service.banking.svc.cluster.local
      timeout: 15s
      retries:
        attempts: 2
        retryOn: gateway-error,reset,retriable-4xx
        perTryTimeout: 5s
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: api-gateway-dr
  namespace: banking
spec:
  host: api-gateway-service.banking.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http2MaxRequests: 1000
        maxRequestsPerConnection: 10
    outlierDetection:
      consecutiveGatewayErrors: 5
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
---
# Deny all except ingress gateway
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: api-gateway-deny-all
  namespace: banking
spec:
  selector:
    matchLabels:
      app: api-gateway
  action: DENY
  rules:
    - from:
        - source:
            notPrincipals:
              - "cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account"
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: api-gateway-allow-ingress
  namespace: banking
spec:
  selector:
    matchLabels:
      app: api-gateway
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account"