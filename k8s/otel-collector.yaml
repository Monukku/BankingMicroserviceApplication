apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: monitoring
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
          grpc:
            endpoint: 0.0.0.0:4317
    processors:
      batch:
    exporters:
      debug:
        verbosity: basic
      # Grafana Cloud OTLP gateway (ap-south-1). Auth header is injected from the
      # grafana-cloud-otlp Secret via the GRAFANA_OTLP_AUTH_HEADER env var so the
      # token is never committed to git. Endpoint posts to .../otlp/v1/traces.
      otlphttp/grafana:
        endpoint: https://otlp-gateway-prod-ap-south-1.grafana.net/otlp
        headers:
          Authorization: "${env:GRAFANA_OTLP_AUTH_HEADER}"
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug, otlphttp/grafana]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
      - name: otel-collector
        image: otel/opentelemetry-collector:0.96.0
        args: ["--config=/etc/otel/config.yaml"]
        env:
        # Full "Basic base64(instanceID:token)" header for Grafana Cloud OTLP.
        # Secret created out-of-band (kubectl), never committed:
        #   kubectl create secret generic grafana-cloud-otlp -n monitoring \
        #     --from-literal=auth-header="Basic <base64(instanceID:token)>"
        - name: GRAFANA_OTLP_AUTH_HEADER
          valueFrom:
            secretKeyRef:
              name: grafana-cloud-otlp
              key: auth-header
        ports:
        - containerPort: 4317
        - containerPort: 4318
        volumeMounts:
        - name: config
          mountPath: /etc/otel
        resources:
          requests:
            memory: 128Mi
            cpu: 100m
          limits:
            memory: 256Mi
            cpu: 200m
      volumes:
      - name: config
        configMap:
          name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: monitoring
spec:
  selector:
    app: otel-collector
  ports:
  - name: grpc
    port: 4317
    targetPort: 4317
  - name: http
    port: 4318
    targetPort: 4318
