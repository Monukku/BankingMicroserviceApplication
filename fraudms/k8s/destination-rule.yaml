# 3s timeout — fraud must be fast
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: fraud-ms-dr
  namespace: banking
spec:
  host: fraud-service.banking.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http2MaxRequests: 500
        maxRequestsPerConnection: 5
    outlierDetection:
      consecutiveGatewayErrors: 3
      interval: 5s
      baseEjectionTime: 10s      # aggressive ejection for fraud
      maxEjectionPercent: 50