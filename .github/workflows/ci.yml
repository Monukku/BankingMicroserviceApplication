name: RewaBank CI/CD

on:
  push:
    branches: [ "master", "main", "feature/**", "fix/**" ]
  pull_request:
    branches: [ "master", "main" ]

env:
  JAVA_VERSION: "21"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/rewabank

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      any_changed: ${{ steps.filter.outputs.any_changed }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect changed services
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            any_changed:
              - 'accounts-service/**'
              - 'api-gateway/**'
              - 'audit-service/**'
              - 'auth-service/**'
              - 'cards-service/**'
              - 'customers-service/**'
              - 'fraud-service/**'
              - 'loans-service/**'
              - 'notifications-service/**'
              - 'transactions-service/**'
              - 'rewabank-bom/**'

  build-and-test:
    name: Build & Test — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      github.ref == 'refs/heads/master' ||
      github.ref == 'refs/heads/main' ||
      needs.detect-changes.outputs.any_changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: accounts-service
            dir: accounts-service
          - service: api-gateway
            dir: api-gateway
          - service: audit-service
            dir: audit-service
          - service: auth-service
            dir: auth-service
          - service: cards-service
            dir: cards-service
          - service: customers-service
            dir: customers-service
          - service: fraud-service
            dir: fraud-service
          - service: loans-service
            dir: loans-service
          - service: notifications-service
            dir: notifications-service
          - service: transactions-service
            dir: transactions-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Install BOM
        run: mvn -f rewabank-bom/pom.xml install -q

      - name: Build & Test
        run: mvn -f ${{ matrix.dir }}/pom.xml verify -q

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.service }}
          path: ${{ matrix.dir }}/target/*.jar
          retention-days: 1

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.service }}
          path: ${{ matrix.dir }}/target/surefire-reports/
          retention-days: 7

  docker-build:
    name: Docker — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: accounts-service
            dir: accounts-service
            deploy: accounts-ms
          - service: api-gateway
            dir: api-gateway
            deploy: api-gateway
          - service: audit-service
            dir: audit-service
            deploy: audit-ms
          - service: auth-service
            dir: auth-service
            deploy: auth-ms
          - service: cards-service
            dir: cards-service
            deploy: cards-ms
          - service: customers-service
            dir: customers-service
            deploy: customers-ms
          - service: fraud-service
            dir: fraud-service
            deploy: fraud-ms
          - service: loans-service
            dir: loans-service
            deploy: loans-ms
          - service: notifications-service
            dir: notifications-service
            deploy: notifications-ms
          - service: transactions-service
            dir: transactions-service
            deploy: transactions-ms

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: jar-${{ matrix.service }}
          path: ${{ matrix.dir }}/target/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.dir }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to K8s
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    environment:
      name: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Verify cluster
        run: kubectl get nodes

      - name: Apply Istio resources
        run: kubectl apply -f k8s/istio/ --ignore-not-found

      - name: Apply app manifests
        run: kubectl apply -f k8s/apps/ --ignore-not-found

      - name: Update image tags
        env:
          OWNER: ${{ github.repository_owner }}
          REGISTRY: ${{ env.REGISTRY }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          declare -A services=(
            [accounts-ms]="accounts-service"
            [api-gateway]="api-gateway"
            [audit-ms]="audit-service"
            [auth-ms]="auth-service"
            [cards-ms]="cards-service"
            [customers-ms]="customers-service"
            [fraud-ms]="fraud-service"
            [loans-ms]="loans-service"
            [notifications-ms]="notifications-service"
            [transactions-ms]="transactions-service"
          )
          for deploy in "${!services[@]}"; do
            svc="${services[$deploy]}"
            image="${REGISTRY}/${OWNER}/rewabank/${svc}:${SHORT_SHA}"
            kubectl set image deployment/${deploy} ${deploy}=${image} -n banking || true
          done

      - name: Wait for rollouts
        run: |
          for deploy in accounts-ms api-gateway audit-ms auth-ms cards-ms customers-ms fraud-ms loans-ms notifications-ms transactions-ms; do
            kubectl rollout status deployment/${deploy} -n banking --timeout=300s || \
            kubectl rollout undo deployment/${deploy} -n banking || true
          done

      - name: Summary
        if: always()
        run: kubectl get deployments -n banking

  security-scan:
    name: OWASP Security Scan
    runs-on: ubuntu-latest
    needs: detect-changes
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Install BOM
        run: mvn -f rewabank-bom/pom.xml install -q

      - name: OWASP Dependency Check
        run: |
          mvn org.owasp:dependency-check-maven:aggregate \
            -DfailBuildOnCVSS=9 \
            -Dformats=HTML,JSON \
            -DassemblyAnalyzerEnabled=false \
            --fail-at-end || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-report-${{ github.run_number }}
          path: "**/dependency-check-report.*"
          retention-days: 30

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [ build-and-test, security-scan ]
    if: always()
    steps:
      - name: Check result
        run: |
          BUILD="${{ needs.build-and-test.result }}"
          if [ "$BUILD" != "success" ] && [ "$BUILD" != "skipped" ]; then
            echo "❌ Build/Test failed: $BUILD"
            exit 1
          fi
          echo "✅ Quality gate passed"