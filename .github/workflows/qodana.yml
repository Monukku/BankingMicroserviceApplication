#-------------------------------------------------------------------------------#
#                    RewaBank — Qodana Workflow                                 #
#                                                                               #
#  FILE LOCATION: .github/workflows/qodana.yml                                 #
#  PURPOSE: Tells GitHub Actions WHEN and HOW to run Qodana                    #
#-------------------------------------------------------------------------------#

name: Qodana Code Quality

on:
  # Run on every PR to main — blocks merge if quality drops
  pull_request:
    branches: [ "master", "main" ]

  # Run on push to main — updates baseline
  push:
    branches: [ "master", "main" ]

  # Allow manual trigger from GitHub UI
  workflow_dispatch:

concurrency:
  group: qodana-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qodana:
    name: Qodana Scan
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
      security-events: write   # upload SARIF to GitHub Security tab

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history needed for accurate diff on PRs
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2026.1
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        with:
          # On PRs — only scan changed files (faster, less noise)
          # On push to main — scan everything
          pr-mode: ${{ github.event_name == 'pull_request' }}
          use-caches: true
          post-pr-comment: true    # posts results as PR comment
          use-annotations: true    # annotates changed lines in PR
          upload-result: true      # saves results to Qodana Cloud
          push-fixes: none         # developers fix manually, no auto commits

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ runner.temp }}/qodana/results/qodana.sarif.json
        continue-on-error: true   # don't fail if SARIF not generated