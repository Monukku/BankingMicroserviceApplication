## ─────────────────────────────────────────────────────────────────────────────
## audit-ms — COMMON base config (profile-independent).
## Environment-specific endpoints/credentials live in application-{dev,prod}.yml.
## Active profile defaults to `prod`; override with SPRING_PROFILES_ACTIVE or
## -Dspring.profiles.active=dev for local development.
## ─────────────────────────────────────────────────────────────────────────────
server:
  port: 9011
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: audit-ms
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}

  data:
    mongodb:
      auto-index-creation: true

  kafka:
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:audit-ms}
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: ${KAFKA_MAX_POLL_RECORDS:50}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.rewabank,java.util,java.time,java.math"
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{rewabank-correlation-id}] [%X{traceId}] %-5level %logger{36} - %msg%n"

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}