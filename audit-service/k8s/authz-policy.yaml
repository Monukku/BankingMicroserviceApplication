# Audit MS — GET only from API Gateway (AUDITOR role)
# POST/PUT/DELETE denied at SecurityConfig level
# Kafka consumer needs no HTTP policy
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: audit-ms-policy
  namespace: banking
spec:
  selector:
    matchLabels:
      app: audit-ms
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/banking/sa/api-gateway-sa"
      to:
        - operation:
            methods: ["GET"]
            paths: ["/api/v1/audit/*"]
    - from:
        - source:
            namespaces: ["monitoring"]
      to:
        - operation:
            paths: ["/actuator/health", "/actuator/prometheus"]