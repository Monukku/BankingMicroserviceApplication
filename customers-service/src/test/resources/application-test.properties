spring.datasource.url=jdbc:h2:mem:customerstestdb;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.flyway.enabled=false

spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration,\
  org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/auth/realms/test
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/auth/realms/test/protocol/openid-connect/certs

# AES key for EncryptionConfig (test-only 32-byte base64; prod injects AES_ENCRYPTION_KEY from a K8s Secret)
encryption.aes-key=dGVzdGtleXRlc3RrZXl0ZXN0a2V5dGVzdGtleXRlc3Q=

# S3-compatible (MinIO) stub for tests — beans are mocked so no real connection attempted
s3.endpoint=http://localhost:9000
s3.access-key=testkey
s3.secret-key=testsecret
s3.region=eu-central-003
s3.bucket-name=test-bucket

logging.level.root=WARN
logging.level.com.rewabank=DEBUG
