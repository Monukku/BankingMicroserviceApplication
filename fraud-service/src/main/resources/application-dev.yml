## ─────────────────────────────────────────────────────────────────────────────
## fraud-ms — DEV profile (local development).
## Activate with: -Dspring.profiles.active=dev
## ─────────────────────────────────────────────────────────────────────────────
spring:
  datasource:
    url:      ${DB_URL:jdbc:postgresql://localhost:5432/fraud_db}
    username: ${DB_USERNAME:fraud_user}
    password: ${DB_PASSWORD:fraud_pass}

  jpa:
    show-sql: true

  data:
    redis:
      host:     ${REDIS_HOST:localhost}
      port:     ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout:  1s

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri:  ${KEYCLOAK_ISSUER_URI:http://localhost:8080/auth/realms/rewabank}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8080/auth/realms/rewabank/protocol/openid-connect/certs}

management:
  tracing:
    sampling:
      probability: ${OTEL_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_ENDPOINT:http://localhost:4318/v1/traces}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

logging:
  level:
    com.rewabank: DEBUG