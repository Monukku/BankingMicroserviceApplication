## ─────────────────────────────────────────────────────────────────────────────
## fraud-ms — COMMON base config (profile-independent).
## Environment-specific endpoints/credentials live in application-{dev,prod}.yml.
## Active profile defaults to `prod`; override with SPRING_PROFILES_ACTIVE or
## -Dspring.profiles.active=dev for local development.
## ─────────────────────────────────────────────────────────────────────────────
server:
  port: 8094
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: fraud-ms
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}

  datasource:
    hikari:
      maximum-pool-size: 2
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:fraud-ms}
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: ${KAFKA_MAX_POLL_RECORDS:50}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.rewabank,java.util,java.time,java.math"
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor

kafka:
  topics:
    alert-raised:  bank.fraud.alert.raised
    alert-cleared: bank.fraud.alert.cleared
  consumer:
    groups:
      transactions: ${KAFKA_FRAUD_TXN_GROUP:fraud-ms-transactions}
      balance:      ${KAFKA_FRAUD_BALANCE_GROUP:fraud-ms-balance}
      accounts:     ${KAFKA_FRAUD_ACCOUNTS_GROUP:fraud-ms-accounts}

fraud:
  alert:
    threshold: 80   # minimum score to raise a fraud alert (0-100)

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{rewabank-correlation-id}] [%X{traceId}] %-5level %logger{36} - %msg%n"