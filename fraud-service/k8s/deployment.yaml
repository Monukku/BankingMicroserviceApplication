apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-ms
  namespace: banking
  labels:
    app: fraud-ms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fraud-ms
  template:
    metadata:
      labels:
        app: fraud-ms
      annotations:
        sidecar.istio.io/inject: "true"
        prometheus.io/scrape: "true"
        prometheus.io/port:   "8094"
        prometheus.io/path:   "/actuator/prometheus"
    spec:
      serviceAccountName: fraud-ms-sa
      containers:
        - name: fraud-ms
          image: rewabank/rewabank-fraud-ms:latest
          ports:
            - containerPort: 8094
          envFrom:
            - configMapRef:
                name: fraud-ms-config
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: fraud-db-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fraud-db-secret
                  key: password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: password
          resources:
            requests:
              memory: "256Mi"
              cpu:    "500m"     # CPU priority — must score fast
            limits:
              memory: "512Mi"
              cpu:    "1000m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8094
            initialDelaySeconds: 90
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8094
            initialDelaySeconds: 60
            periodSeconds: 10
