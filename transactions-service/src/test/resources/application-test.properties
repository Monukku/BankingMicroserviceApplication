spring.datasource.url=jdbc:h2:mem:txntestdb;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.flyway.enabled=false

spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration,\
  org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/auth/realms/test
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/auth/realms/test/protocol/openid-connect/certs

accounts.service.url=http://localhost:8081
fraud.service.url=http://localhost:8094

# Custom KafkaConfig reads this via @Value even though Kafka autoconfig is excluded.
# Connection endpoints now live in the dev/prod profiles, so the test profile supplies its own.
spring.kafka.bootstrap-servers=localhost:9092

logging.level.root=WARN
logging.level.com.rewabank=DEBUG
