## ─────────────────────────────────────────────────────────────────────────────
## transactions-ms — COMMON base config (profile-independent).
## Environment-specific endpoints/credentials live in application-{dev,prod}.yml.
## Active profile defaults to `prod`; override with SPRING_PROFILES_ACTIVE or
## -Dspring.profiles.active=dev for local development.
## ─────────────────────────────────────────────────────────────────────────────
server:
  port: 8082
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: transactions-ms
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}

  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 5000
      keepalive-time: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    web:
      pageable:
        max-page-size: 100   # prevent large result set DoS
        default-page-size: 20

  kafka:
    topics:
      initiated: bank.transaction.initiated
      completed: bank.transaction.completed
      failed: bank.transaction.failed
      reversed: bank.transaction.reversed
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: ${KAFKA_MAX_POLL_RECORDS:50}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.rewabank,java.util,java.time,java.math"
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
        group:
          enabled: true   # CB name = client name (accounts-service / fraud-service) so YAML config applies
      httpclient:
        hc5:
          enabled: true

kafka:
  consumer:
    groups:
      payments: ${KAFKA_PAYMENTS_GROUP:transactions-ms-payments}

internal:
  call:
    secret: ${INTERNAL_CALL_SECRET}

resilience4j:
  circuitbreaker:
    instances:
      fraud-service:
        sliding-window-size: ${CB_FRAUD_WINDOW:5}
        minimum-number-of-calls: ${CB_FRAUD_MIN_CALLS:5}
        failure-rate-threshold: ${CB_FRAUD_FAILURE_RATE:30}
        wait-duration-in-open-state: ${CB_FRAUD_WAIT:5s}
        permitted-number-of-calls-in-half-open-state: 2
      accounts-service:
        sliding-window-size: ${CB_ACCOUNTS_WINDOW:10}
        minimum-number-of-calls: ${CB_ACCOUNTS_MIN_CALLS:10}
        failure-rate-threshold: ${CB_ACCOUNTS_FAILURE_RATE:50}
        wait-duration-in-open-state: ${CB_ACCOUNTS_WAIT:10s}
        permitted-number-of-calls-in-half-open-state: 3
  timelimiter:
    instances:
      fraud-service:
        timeout-duration: ${CB_FRAUD_TIMEOUT:3s}    # fraud must answer in 3s
      accounts-service:
        timeout-duration: ${CB_ACCOUNTS_TIMEOUT:5s}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{rewabank-correlation-id}] [%X{traceId}] %-5level %logger{36} - %msg%n"