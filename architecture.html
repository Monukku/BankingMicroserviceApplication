<style>
:root{
  --bg:#ECEEF1; --board:#FFFFFF; --frame:#D5D9DF; --ink:#23272D; --muted:#6B7280;
  --blue:#1D5FD1; --red:#D0453C; --green:#17845A; --orange:#D98300; --purple:#6F48D6;
  --note:#FFF0A6; --note-ok:#DDF3E5; --note-warn:#FFE0BF;
  --hand:"Kalam",cursive; --scribble:"Caveat",cursive; --body:"IBM Plex Sans",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121519; --board:#1B1F25; --frame:#2C323B; --ink:#E5E8EC; --muted:#9AA3AF;
    --blue:#6E9BFF; --red:#FF7A70; --green:#4FD198; --orange:#F5B041; --purple:#A98BFF;
    --note:#4A4322; --note-ok:#1F3A2C; --note-warn:#4A3420; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121519; --board:#1B1F25; --frame:#2C323B; --ink:#E5E8EC; --muted:#9AA3AF;
  --blue:#6E9BFF; --red:#FF7A70; --green:#4FD198; --orange:#F5B041; --purple:#A98BFF;
  --note:#4A4322; --note-ok:#1F3A2C; --note-warn:#4A3420; color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:6px}

header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--frame)}
.hbar{max-width:1280px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:22px}
.logo{font:700 24px/1 var(--hand);white-space:nowrap}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1}
nav::-webkit-scrollbar{display:none}
nav button{border:0;background:none;color:var(--muted);font:400 17px var(--hand);padding:6px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
nav button:hover{color:var(--ink)}
nav button[aria-selected="true"]{color:var(--ink);background:var(--board);box-shadow:0 0 0 1px var(--frame)}
.theme{border:1px solid var(--frame);background:var(--board);border-radius:8px;width:36px;height:36px;cursor:pointer;display:grid;place-items:center;flex-shrink:0}

main{max-width:1280px;margin:0 auto;padding:30px 20px 56px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:18px}
h1{font:700 clamp(28px,3.6vw,40px)/1.1 var(--hand)}
.lede{color:var(--muted);margin-top:6px;max-width:60ch}
.btn{border:2px solid var(--ink);background:var(--board);border-radius:10px;padding:7px 16px;font:700 17px var(--hand);cursor:pointer}
.btn:hover{background:var(--ink);color:var(--board)}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:20px;align-items:start}
.board{background:var(--board);border:1px solid var(--frame);border-radius:14px;padding:14px;box-shadow:0 1px 0 var(--frame)}
.board + .board{margin-top:20px}
.board h2{font:700 20px var(--hand);margin:4px 6px 0}
.scroll{overflow-x:auto}
svg.sk{display:block;width:100%;height:auto;min-width:880px}
svg.sk text{font-family:var(--hand)}
svg.sk .scr{font-family:var(--scribble)}

/* interactive nodes */
.nd{cursor:pointer;outline:none}
.nd:hover path,.nd:focus-visible path{stroke:var(--blue)!important}
.nd.sel path{stroke:var(--blue)!important;stroke-width:2.6!important}
.sk.tracing .nd{opacity:.3;transition:opacity .3s}
.sk.tracing .nd.hl{opacity:1}
.sk.tracing .nd.hl path{stroke:var(--blue)!important;stroke-width:2.6!important}
.sk.tracing .ed{opacity:.2;transition:opacity .3s}
.sk.tracing .ed.hl{opacity:1}
.sk.tracing .ed.hl path{stroke:var(--blue)!important;stroke-dasharray:9 7;animation:march .7s linear infinite}
.sk.tracing .ed.hl text{fill:var(--blue)!important}
@keyframes march{to{stroke-dashoffset:-32}}
.pop{position:absolute;z-index:30;width:260px;background:var(--note);border-radius:3px;padding:14px 16px 16px;
  box-shadow:0 10px 22px -10px rgba(0,0,0,.45);rotate:-1deg;pointer-events:auto}
.pop h3{font:700 21px/1.1 var(--hand);margin-bottom:4px}
.pop p{font-size:14px;margin-bottom:6px}
.pop ul{list-style:none;display:grid;gap:4px;font-size:14px}
.pop li{padding-left:16px;position:relative}.pop li::before{content:"–";position:absolute;left:2px}
.pop .x{position:absolute;top:6px;right:8px;border:0;background:none;font-size:18px;cursor:pointer;color:var(--muted)}
.board{position:relative}

/* sticky note */
.sticky{background:var(--note);border-radius:3px;padding:18px 18px 20px;box-shadow:0 8px 16px -10px rgba(0,0,0,.35);rotate:-1deg;position:sticky;top:80px}
.sticky h3{font:700 24px/1.1 var(--hand);margin-bottom:6px}
.sticky p{margin-bottom:8px}
.sticky ul{list-style:none;display:grid;gap:6px}
.sticky li{padding-left:18px;position:relative}
.sticky li::before{content:"–";position:absolute;left:2px}
.sticky .hint{font:600 19px var(--scribble);color:var(--muted);margin-top:10px}
.tracebar{display:none;align-items:center;gap:12px;margin-top:12px;padding:10px 14px;border-radius:10px;background:var(--board);border:1px solid var(--frame)}
.tracebar.on{display:flex}
.tracebar .n{font:700 18px var(--hand);white-space:nowrap}
.tracebar .cap{flex:1}
.tracebar button{width:34px;height:34px;border-radius:8px;border:1px solid var(--frame);background:var(--bg);cursor:pointer}
.tracebar button:disabled{opacity:.35;cursor:default}

/* failure-mode notes */
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px;padding:8px}
.pn{padding:16px 16px 18px;border-radius:3px;box-shadow:0 8px 16px -10px rgba(0,0,0,.35);background:var(--note-ok)}
.pn:nth-child(3n+1){rotate:-1.2deg}.pn:nth-child(3n+2){rotate:.8deg}.pn:nth-child(3n){rotate:-.4deg}
.pn.warn{background:var(--note-warn)}
.pn h3{font:700 20px/1.15 var(--hand);margin-bottom:6px}
.pn p{font-size:14px}
.pn .tag{display:inline-block;margin-top:8px;font:600 18px var(--scribble);color:var(--orange)}

footer{max-width:1280px;margin:0 auto;padding:0 20px 36px;color:var(--muted);font:400 16px var(--hand)}

@media (max-width:1000px){ .layout{grid-template-columns:1fr} .sticky{position:static;rotate:0deg} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>

  <div class="hbar">
    <div class="logo">RewaBank</div>
    <nav id="tabs" role="tablist"></nav>
    <button class="theme" id="theme" aria-label="Switch light or dark theme">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>

  </div>
</header>
<main id="view"></main>
<footer>Java 21, Spring Boot 3.4, Spring Cloud 2024, Kafka, PostgreSQL, Redis, Kubernetes + Istio</footer>

      const n=5,gap=w/(n+1);for(let i=1;i<=n;i++)add(draw('linearPath',[[[x+gap*i,y+12],[x+gap*i,y+h-12]]],{stroke:c,strokeWidth:1.4}));
      if(label) api.text(x+w/2,y+h+22,label,{bold:true,size:21});},
    bucket(x,y,w,h,label){add(draw('path',[`M${x},${y} L${x+w},${y} L${x+w-12},${y+h} L${x+12},${y+h} Z`],{stroke:COL.ink,fill:COL.board,fillStyle:'solid'}));
      add(draw('ellipse',[x+w/2,y,w,12],{stroke:COL.ink}));
      if(label) api.text(x+w/2,y+h/2+4,label,{size:17,bold:true});},
    circle(cx,cy,d,label,o={}){add(draw('circle',[cx,cy,d],{stroke:COL[o.c||'ink'],fill:COL.board,fillStyle:'solid',strokeWidth:o.sw||1.7}));
      if(label) api.text(cx,cy+1,label,{size:o.size||18,bold:true,c:o.tc||'ink'});},
    num(cx,cy,n,c='blue'){api.circle(cx,cy,28,String(n),{c,size:15,tc:c,sw:1.8});},
    arrow(pts,o={}){const c=COL[o.c||'ink'];
      add(draw('linearPath',[pts],{stroke:c,strokeWidth:o.sw||1.7,strokeLineDash:o.dash?[7,6]:undefined}));
      const [a,b]=[pts[pts.length-2],pts[pts.length-1]],ang=Math.atan2(b[1]-a[1],b[0]-a[0]),L=12,s=.45;
      add(draw('linearPath',[[[b[0]-L*Math.cos(ang-s),b[1]-L*Math.sin(ang-s)],b,[b[0]-L*Math.cos(ang+s),b[1]-L*Math.sin(ang+s)]]],{stroke:c,strokeWidth:o.sw||1.7}));
      if(o.label){const m=o.at||[(a[0]+b[0])/2,(a[1]+b[1])/2-14];api.note(m[0],m[1],o.label,{c:o.lc||'muted',size:o.ls||21,anchor:o.anchor});}},
    line(pts,o={}){add(draw('linearPath',[pts],{stroke:COL[o.c||'muted'],strokeWidth:o.sw||1.4,strokeLineDash:o.dash?[6,6]:undefined}));},
  };
  return api;
}
function scene(w,h,fn,label){
  const svg=mk('svg',{viewBox:`0 0 ${w} ${h}`,class:'sk',role:'img','aria-label':label||''});
  fn(Sketch(svg),svg);return svg;
}

    const items=[];
    svg.querySelectorAll('path').forEach(p=>{
      if(p.getAttribute('stroke')==='none'||p.getAttribute('stroke-dasharray'))return;
      let len=0;try{len=p.getTotalLength();}catch(_){}
      if(!len)return;
      const bb=p.getBBox();items.push([p,len,(bb.x-X0)/W]);
    });
    const fades=[...svg.querySelectorAll('text, path[stroke="none"], path[stroke-dasharray]')];
    items.forEach(([p,len])=>{p.style.strokeDasharray=len;p.style.strokeDashoffset=len;});
    fades.forEach(f=>{f.style.opacity=0;});
    svg.getBoundingClientRect();
    requestAnimationFrame(()=>{
      items.forEach(([p,len,f])=>{p.style.transition=`stroke-dashoffset .55s ease-out ${(f*0.9).toFixed(2)}s`;p.style.strokeDashoffset=0;});
      fades.forEach(t=>{let f=.3;try{const bb=t.getBBox();f=(bb.x-X0)/W;}catch(_){} t.style.transition=`opacity .35s ease ${(f*0.9+.2).toFixed(2)}s`;t.style.opacity='';});
    });
    setTimeout(()=>{items.forEach(([p])=>{p.style.transition='';p.style.strokeDasharray='';p.style.strokeDashoffset='';});fades.forEach(t=>t.style.transition='');},1800);
  });
}

/* ── Navigation ────────────────────────────────────── */
const simple=(fn,w,h,id='sc')=>()=>{const el=document.getElementById(id);el.innerHTML='';el.appendChild(scene(w,h,fn));};
const VIEWS=[
  ['Overview',vOverview,mountOverview],
  ['Auth',vGateway,simple(drawGateway,1200,460)],
  ['Events',vKafka,simple(drawKafka,1260,500)],
  ['Sync calls',vFeign,simple(drawFeign,1200,450)],
  ['Data',vData,simple(drawData,1200,490)],
  ['Saga',vSaga,()=>{simple(drawSaga,1200,360)();simple(drawOutbox,1040,240,'sc2')();}],
  ['Failure modes',vResilience],
];
const tabs=document.getElementById('tabs'),view=document.getElementById('view');
tabs.innerHTML=VIEWS.map((v,i)=>`<button role="tab" data-i="${i}">${esc(v[0])}</button>`).join('');
let cur=0;
function go(i,anim=true){
  clearInterval(timer);step=-1;cur=i;
  view.innerHTML=VIEWS[i][1]();if(VIEWS[i][2])VIEWS[i][2]();
  if(anim)drawOn();
  tabs.querySelectorAll('button').forEach((b,j)=>b.setAttribute('aria-selected',j===i));
  try{history.replaceState(null,'','#'+i);}catch(_){}
  window.scrollTo({top:0});
}
tabs.onclick=e=>{const b=e.target.closest('button');if(b)go(+b.dataset.i);};
document.addEventListener('keydown',e=>{const n=parseInt(e.key,10);if(n>=1&&n<=VIEWS.length)go(n-1);});

const root=document.documentElement;
try{const t=localStorage.getItem('rb-theme');if(t)root.dataset.theme=t;}catch(_){}
document.getElementById('theme').onclick=()=>{
  const dark=root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme=dark?'light':'dark';try{localStorage.setItem('rb-theme',root.dataset.theme);}catch(_){}
};
let h=0;try{h=parseInt(location.hash.slice(1),10);}catch(_){}
const first=h>=0&&h<VIEWS.length?h:0;
if(document.fonts&&document.fonts.status!=='loaded'){go(first,false);document.fonts.ready.then(()=>go(cur,true));}else go(first);
</script>
