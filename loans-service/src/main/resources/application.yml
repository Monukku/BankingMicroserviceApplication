## ─────────────────────────────────────────────────────────────────────────────
## loans-ms — COMMON base config (profile-independent).
## Environment-specific endpoints/credentials live in application-{dev,prod}.yml.
## Active profile defaults to `prod`; override with SPRING_PROFILES_ACTIVE or
## -Dspring.profiles.active=dev for local development.
## ─────────────────────────────────────────────────────────────────────────────
server:
  port: 8090
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: loans-ms
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}

  data:
    web:
      pageable:
        max-page-size: 100
        default-page-size: 20

  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      # 3s (was 30s): fail internally inside the 10s Istio Backend VS.
      connection-timeout: 3000
      keepalive-time: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      okhttp:
        enabled: true

internal:
  call:
    secret: ${INTERNAL_CALL_SECRET:rewabank-internal-secret}

kafka:
  topics:
    loan-applied:   bank.loan.applied
    loan-approved:  bank.loan.approved
    loan-rejected:  bank.loan.rejected
    loan-disbursed: bank.loan.disbursed

resilience4j:
  circuitbreaker:
    instances:
      accounts-service:
        sliding-window-size: ${CB_SLIDING_WINDOW:10}
        failure-rate-threshold: ${CB_FAILURE_RATE:50}
        wait-duration-in-open-state: ${CB_WAIT_DURATION:10s}
        permitted-number-of-calls-in-half-open-state: 2
      fraud-service:
        sliding-window-size: 5
        failure-rate-threshold: 30
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 2
  timelimiter:
    instances:
      accounts-service:
        timeout-duration: ${CB_TIMEOUT:5s}
      fraud-service:
        timeout-duration: 3s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true

logging:
  pattern:
    level: "%5p[${spring.application.name},%X{traceId},%X{spanId}]"
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{traceId}] %-5level %logger{36} - %msg%n"