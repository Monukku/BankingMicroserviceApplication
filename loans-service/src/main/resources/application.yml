server:
  port: 8090
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: loans-ms

  datasource:
    url: ${DB_URL:jdbc:postgresql://postgresql-rw.banking.svc.cluster.local:5432/loans_db}
    username: ${DB_USERNAME:loans_user}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:kafka-kafka-bootstrap.banking.svc.cluster.local:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWKS_URI}
          # ADDED: issuer-uri for JWT iss claim validation
          issuer-uri: ${KEYCLOAK_ISSUER_URI}

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

accounts:
  service:
    url: ${ACCOUNTS_SERVICE_URL:http://accounts-service.banking.svc.cluster.local:8081}

kafka:
  topics:
    loan-applied:   bank.loan.applied
    loan-approved:  bank.loan.approved
    loan-rejected:  bank.loan.rejected
    loan-disbursed: bank.loan.disbursed

resilience4j:
  circuitbreaker:
    instances:
      accounts-service:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
  timelimiter:
    instances:
      accounts-service:
        timeout-duration: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true
  # ADDED: OTel tracing
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector.monitoring.svc.cluster.local:4318/v1/traces}

logging:
  level:
    com.rewabank: DEBUG
    org.springframework.security: INFO
  pattern:
    level: "%5p[${spring.application.name},%X{traceId},%X{spanId}]"
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{traceId}] %-5level %logger{36} - %msg%n"