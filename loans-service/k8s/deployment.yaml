apiVersion: apps/v1
kind: Deployment
metadata:
  name: loans-ms
  namespace: banking
  labels:
    app: loans-ms
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loans-ms
  template:
    metadata:
      labels:
        app: loans-ms
        version: v1
      annotations:
        sidecar.istio.io/inject: "true"
        prometheus.io/scrape: "true"
        prometheus.io/port: "8090"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: loans-ms-sa
      containers:
        - name: loans-ms
          image: rewabank/rewabank-loans-ms:latest  # FIXED: was YOUR_DOCKERHUB
          ports:
            - containerPort: 8090
          envFrom:
            - configMapRef:
                name: loans-ms-config
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: loans-db-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: loans-db-secret
                  key: password
            # ADDED: OTEL endpoint from configmap (already in envFrom but explicit for clarity)
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8090
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8090
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3